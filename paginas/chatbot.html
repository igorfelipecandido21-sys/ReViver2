<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ReViver | Chatbot</title><link rel="stylesheet" href="../css/base.css">
<style>
.chat-layout{display:flex;flex-direction:column;gap:18px}.chat-messages{min-height:380px;max-height:52vh;overflow-y:auto;padding:8px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap}.quick-actions button{border:1px solid #4d7db0;background:transparent;color:#dceeff;border-radius:999px;padding:8px 12px;cursor:pointer}.quick-actions button:hover{background:#244d75}.typing{opacity:.7;font-style:italic}.chat-form{display:flex;gap:10px}.chat-form .input{flex:1}
</style></head>
<body><div class="screen"><div class="app-shell"><main class="page"><a class="back js-back" href="#">‹</a><div class="panel chat-layout">
<div class="chat-intro"><div style="display:flex;align-items:center;gap:15px"><span class="round-icon">🤖</span><div><h1 style="font-size:34px">Chatbot ReViver</h1><p style="color:#86b9e4">Assistente para informações, orientação sobre a plataforma e recursos de apoio.</p></div></div></div>
<div class="quick-actions"><button type="button" data-chat="Como posso buscar ajuda?">Buscar ajuda</button><button type="button" data-chat="Quero informações sobre substâncias">Substâncias</button><button type="button" data-chat="Como posso ajudar um familiar?">Apoio à família</button><button type="button" data-chat="Onde encontro os serviços?">Serviços</button></div>
<div id="messages" class="chat-messages"><div class="message bot">Olá! Eu sou o assistente do ReViver. Pode me fazer uma pergunta.</div></div>
<form id="chatForm" class="chat-form"><input id="chatInput" class="input" placeholder="Digite sua mensagem..." autocomplete="off" required><button class="send-btn" aria-label="Enviar">➤</button></form>
<p style="font-size:12px;color:#7899b8">O ReViver é uma ferramenta complementar e não substitui profissionais de saúde.</p>
</div></main></div></div>
<script src="../js/app.js"></script><script>document.querySelectorAll('[data-chat]').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById('chatInput');i.value=b.dataset.chat;i.focus();}));</script>
</body></html>
